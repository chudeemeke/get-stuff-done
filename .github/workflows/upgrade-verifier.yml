name: Upgrade Verifier

on:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".planning/upstream-authority.json"
      - "package.json"
      - "bun.lock"
      - "scripts/compose.js"
      - "scripts/verify-upgrade.js"
      - "bin/install.js"
      - "overlay/**"
      - "overrides/**"
      - ".github/workflows/upgrade-verifier.yml"

permissions:
  contents: read

jobs:
  upgrade-verifier:
    name: Upgrade Verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - name: Install repository dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # The verifier packs the CURRENT package with the checkout's dist/ (its
      # copy excludes rebuild for the current package by design), and the real
      # installer refuses a tarball without it - so dist must exist first.
      - name: Compose current package output
        run: bun run compose
      # Started as a step, not a service: service containers launch before
      # checkout, so they cannot load the repository config that disables the
      # npmjs uplink for @chude/* (issue #47). The image digest is the same
      # reviewed pin recorded in config/phase43-toolchain-authority.json.
      - name: Start Verdaccio
        run: >-
          docker run --detach --name verdaccio
          --publish 4873:4873
          --volume "$GITHUB_WORKSPACE/.github/verdaccio/config.yaml":/verdaccio/conf/config.yaml:ro
          verdaccio/verdaccio@sha256:bcd0dc5f10d0b9cca5a21b1f4fb3b08c6d90978bc87b8b46402abb271e0d573a
      - name: Wait for Verdaccio
        run: |
          for attempt in {1..30}; do
            if npm ping --registry http://localhost:4873/; then
              exit 0
            fi
            echo "Verdaccio not ready yet (${attempt}/30)"
            sleep 2
          done
          echo "::error::Verdaccio did not become ready; container logs follow"
          docker logs verdaccio
          exit 1
      - name: Run upgrade verifier
        run: >-
          bun run verify-upgrade --from 1.7.0 --to 1.8.0 --registry-url http://localhost:4873/ --json --report upgrade-report.json
      - name: Upload upgrade report
        if: ${{ always() && hashFiles('upgrade-report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-report
          path: upgrade-report.json
          retention-days: 30
