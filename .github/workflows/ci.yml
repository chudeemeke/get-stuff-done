name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      - name: Run actionlint
        run: bash scripts/lint-workflows.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
          token: ""
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          # Full history is required so gitleaks scans every commit, not just HEAD.
          fetch-depth: 0
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  audit-ci:
    name: Audit CI (blocking HIGH/CRITICAL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
          token: ""
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm install --package-lock-only --ignore-scripts
      - run: bun run audit:ci

  docs-gates:
    name: Docs Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint:docs
      - name: Collect tracked markdown link targets
        shell: bash
        run: |
          git -c core.quotePath=false ls-files "*.md" |
            grep -Ev '^(node_modules/|dist/|\.upstream/|overlay/get-shit-done/)' > .lychee-targets
          test -s .lychee-targets
      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          token: ""
          args: --config lychee.toml --files-from .lychee-targets --no-progress --verbose
          fail: "true"
          failIfEmpty: "true"

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
          token: ""
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      - run: bun install --frozen-lockfile --ignore-scripts
      # The reviewed action revision delegates to this image. Invoke the exact
      # digest directly so the effective scanner identity cannot move with a tag.
      - name: Run OSV scanner against bun.lock
        continue-on-error: true
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:48406c58197201fe55e56615ad9d414f85063da320e204d0b0ed460fb3908dba # v2.3.8
        with:
          args: |-
            scan
            source
            --lockfile=bun.lock
            --format=json
            --output-file=osv-results.json
      - name: Triage OSV findings
        run: node scripts/osv-triage.js --input osv-results.json --output osv-triage.json --fail-on high,critical
      - name: Upload OSV issue proposals
        if: ${{ always() && hashFiles('osv-triage.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-issue-proposals-${{ github.run_id }}
          path: |
            osv-results.json
            osv-triage.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Summarize OSV issue proposals
        if: ${{ always() && hashFiles('osv-triage.json') != '' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const findings = JSON.parse(fs.readFileSync('osv-triage.json', 'utf8'));
          const proposals = findings.filter(finding => ['medium', 'low'].includes(finding.severity));
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `### OSV issue proposals\n\n${proposals.length} medium/low proposal(s) emitted for owner review.\n`
          );
          NODE

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compose
      - run: bun run lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - name: Cache bun dependencies
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compose
      - name: Guard against test files in dist/
        run: node scripts/check-no-test-files-in-dist.js
      - name: Run tests with coverage and JUnit output
        run: bun run test:coverage:bun -- --timeout 30000 --reporter=junit --reporter-outfile test-results.xml
      - name: Upload test results on failure
        if: ${{ failure() && hashFiles('test-results.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          retention-days: 14
      - name: Build Windows flake events
        if: ${{ failure() && matrix.os == 'windows-latest' && hashFiles('test-results.xml') != '' }}
        run: >-
          node scripts/flake-triage.js
          --junit test-results.xml
          --platform windows
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --commit "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          --output flake-events.json
      - name: Upload Windows flake issue proposals
        if: ${{ failure() && matrix.os == 'windows-latest' && hashFiles('flake-events.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-flake-issue-proposals-${{ github.run_id }}
          path: flake-events.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Summarize Windows flake issue proposals
        if: ${{ failure() && matrix.os == 'windows-latest' && hashFiles('flake-events.json') != '' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const proposals = JSON.parse(fs.readFileSync('flake-events.json', 'utf8'));
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `### Windows flake issue proposals\n\n${proposals.length} proposal(s) emitted for owner review.\n`
          );
          NODE
      - name: Append Windows Active REL-03 skips summary
        if: ${{ always() && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          node scripts/flake-triage.js --scan-rel03 --output-summary rel03-summary.md
          {
            cat rel03-summary.md
            echo ""
            echo "Interim flake collector scope cap: more than 5 flaky files/week requires Tailscale collector planning."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/flake-triage.js --validate-rel03-wrappers

  perf-budget:
    name: Perf Budget (${{ matrix.platform }})
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows hosted runners show +/-40-50% install timing noise (2026-08-23: macOS
        # stddev 42% of mean; Windows install 10.5-23.4s across 9 runs). main mitigated that with
        # per-platform loosened ratios against a stored baseline (linux 1.25, macos/windows 2.5).
        # Phase 43 replaces that with paired measurement: reference (PR base) and candidate (PR
        # head) are benchmarked in the same job on the same runner, so runner-to-runner drift
        # cancels instead of being absorbed by a loosened threshold. The floating-ratio API was
        # removed in b0bd9a5d, so no per-platform ratio value is read here any more.
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - name: Checkout trusted bootstrap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository }}
          ref: 5c813db4d8a17bd2dbf7523e016a5152a6a0c3ce
          path: authority-bootstrap
          persist-credentials: false
          fetch-depth: 1
      - name: Verify trusted bootstrap
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: 5c813db4d8a17bd2dbf7523e016a5152a6a0c3ce
          GSD_SUBJECT_PATH: authority-bootstrap
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - name: Checkout trusted measurement harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository }}
          ref: 32dc22f9dc9cfd7d84333256f0768f5a792b186c
          path: measurement-harness
          persist-credentials: false
          fetch-depth: 1
      - name: Verify trusted measurement harness
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: 32dc22f9dc9cfd7d84333256f0768f5a792b186c
          GSD_SUBJECT_PATH: measurement-harness
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - name: Checkout exact pull request base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact pull request base
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event.pull_request.base.sha }}
          GSD_SUBJECT_PATH: reference
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - name: Checkout exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact pull request head
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event.pull_request.head.sha }}
          GSD_SUBJECT_PATH: candidate
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - name: Preflight paired authority files
        shell: bash
        run: |
          for subject in authority-bootstrap measurement-harness reference candidate; do
            for required in package.json bun.lock .planning/upstream-authority.json; do
              if [ ! -f "$subject/$required" ]; then
                echo "::error file=$subject/$required::Missing required paired authority file"
                exit 1
              fi
            done
          done
      - name: Stage trusted Bun authority
        shell: bash
        run: |
          cp authority-bootstrap/.bun-version .bun-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - name: Install reviewed Hyperfine
        shell: bash
        run: |
          node authority-bootstrap/scripts/install-hyperfine.js --destination "$RUNNER_TEMP/gsd-tools"
          echo "$RUNNER_TEMP/gsd-tools" >> "$GITHUB_PATH"
      - name: Install trusted harness dependencies
        shell: bash
        working-directory: measurement-harness
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Capture paired performance evidence
        shell: bash
        run: |
          mkdir -p evidence-bundle
          runner_image="$(node -e "const os=require('os');const p={win32:'windows',darwin:'macos'}[os.platform()]||os.platform();process.stdout.write([p,os.release(),os.version()].join(':'))")"
          node measurement-harness/scripts/bench.js \
            --paired \
            --reference-worktree "$GITHUB_WORKSPACE/reference" \
            --candidate-worktree "$GITHUB_WORKSPACE/candidate" \
            --runner-image "$runner_image" \
            --pairs 10 \
            --warmup 3 \
            --out "$GITHUB_WORKSPACE/evidence-bundle/comparison.json"
      - name: Enforce paired performance budget
        shell: bash
        run: >-
          node measurement-harness/scripts/check-perf.js
          --comparison "$GITHUB_WORKSPACE/evidence-bundle/comparison.json"
          --accepted "$GITHUB_WORKSPACE/candidate/config/perf-accepted-regressions.json"
      - name: Stage bounded evidence producer
        shell: bash
        run: |
          mkdir -p evidence-producer/scripts/lib evidence-producer/config evidence-producer/artifacts
          cp candidate/scripts/emit-hosted-runtime-receipt.js evidence-producer/scripts/
          cp candidate/scripts/emit-paired-binding-manifest.js evidence-producer/scripts/
          cp candidate/scripts/lib/hosted-evidence-binding.js evidence-producer/scripts/lib/
          cp candidate/config/phase43-hosted-ci-contract.json evidence-producer/config/
          cp candidate/config/phase43-toolchain-authority.json evidence-producer/config/
          cp evidence-bundle/comparison.json evidence-producer/artifacts/comparison.json
      - name: Emit Tier B performance receipt
        shell: bash
        run: >-
          node evidence-producer/scripts/emit-hosted-runtime-receipt.js
          --subject "ci-perf-${{ matrix.platform }}"
          --output "artifacts/runtime-receipt.json"
          --tool hyperfine
      - name: Emit paired binding manifest
        shell: bash
        run: >-
          node evidence-producer/scripts/emit-paired-binding-manifest.js
          --bootstrap-repository "${{ github.repository }}"
          --bootstrap-sha "5c813db4d8a17bd2dbf7523e016a5152a6a0c3ce"
          --harness-repository "${{ github.repository }}"
          --harness-sha "32dc22f9dc9cfd7d84333256f0768f5a792b186c"
          --reference-repository "${{ github.event.pull_request.base.repo.full_name }}"
          --reference-sha "${{ github.event.pull_request.base.sha }}"
          --candidate-repository "${{ github.event.pull_request.head.repo.full_name }}"
          --candidate-sha "${{ github.event.pull_request.head.sha }}"
          --tier-b-receipt "artifacts/runtime-receipt.json"
          --comparison "artifacts/comparison.json"
          --output "artifacts/binding-manifest.json"
      - name: Upload paired performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paired-performance-ci-perf-${{ matrix.platform }}
          path: |
            evidence-producer/artifacts/comparison.json
            evidence-producer/artifacts/runtime-receipt.json
            evidence-producer/artifacts/binding-manifest.json
          if-no-files-found: error
          overwrite: false

  parity:
    name: Source Parity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compose
      - run: bun run sbom
      - name: Verify SBOM artifact
        run: test -f dist/bom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-sbom
          path: dist/bom.json
          if-no-files-found: error
          retention-days: 30
      - run: node scripts/check-parity.js

  upstream-compat:
    name: Upstream Compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Informational: branding-caused upstream test differences are expected.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - name: Cache bun dependencies
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run compose
      - name: Repository compatibility contracts (blocking)
        run: bun run test:repository-compat
      - run: node scripts/run-upstream-compat-ci.js

  boundary-check:
