name: Compat Matrix

on:
  pull_request:
    paths:
      - ".planning/vetted-upstream-versions.json"
      - ".planning/upstream-authority.json"
      - "package.json"
      - "bun.lock"
      - "scripts/run-compat-matrix.js"
      - "scripts/run-repository-compat.js"
      - "scripts/run-upstream-compat*.js"
      - "scripts/vetted-upstream-versions.js"
      - "tests/upstream-compat-contract.json"
      - "tests/*.test.cjs"
      - "tests/helpers.cjs"
      - "tests/helpers/**"
      - "overlay/**"
      - "overrides/**"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  compat-matrix:
    name: Vetted Upstream Compat Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .
          persist-credentials: false
          fetch-depth: 1
      - name: Verify execution subject
        shell: bash
        env:
          GSD_EXPECTED_SUBJECT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GSD_SUBJECT_PATH: .
        run: |-
          actual="$(git -C "$GSD_SUBJECT_PATH" rev-parse HEAD)"
          if [ "$actual" != "$GSD_EXPECTED_SUBJECT" ]; then
            echo "::error::Expected $GSD_EXPECTED_SUBJECT but checked out $actual"
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate vetted upstream manifest
        run: node scripts/vetted-upstream-versions.js --validate

      - name: Run compat matrix
        run: node scripts/run-compat-matrix.js --manifest .planning/vetted-upstream-versions.json --json --report compat-matrix-report.json

      - name: Upload compat matrix report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compat-matrix-report
          path: compat-matrix-report.json
          if-no-files-found: error
