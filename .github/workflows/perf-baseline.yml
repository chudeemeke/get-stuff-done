name: Historical Perf Trend (Manual, Non-Blocking)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          token: ""
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install reviewed Hyperfine
        shell: bash
        run: |
          node scripts/install-hyperfine.js --destination "$RUNNER_TEMP/gsd-tools"
          echo "$RUNNER_TEMP/gsd-tools" >> "$GITHUB_PATH"
      - name: Capture install and compose baseline
        run: node scripts/bench.js --platform ${{ matrix.platform }} --out perf-${{ matrix.platform }}.json
      - name: Capture test timing baseline
        run: node scripts/bench-test-timing.js --platform ${{ matrix.platform }} --runs 5 --out test-timing-${{ matrix.platform }}.json
      - name: Upload platform perf artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-${{ matrix.platform }}
          path: |
            perf-${{ matrix.platform }}.json
            test-timing-${{ matrix.platform }}.json
          retention-days: 30

  merge:
    name: Merge Baseline Artifacts
    runs-on: ubuntu-latest
    needs: capture
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          token: ""
      # First-run protocol:
      # 1. Register this workflow on the default branch.
      # 2. Run: gh workflow run perf-baseline.yml --ref <phase-41-ref>.
      # 3. Download artifacts from the workflow run.
      # 4. Commit only merged real linux/macos/windows outputs.
      - name: Merge install and compose baseline
        run: node scripts/bench.js --merge artifacts --require-platforms linux,macos,windows --out perf-baseline.json
      - name: Merge test timing baseline
        run: node scripts/bench-test-timing.js --merge artifacts --require-platforms linux,macos,windows --out .planning/perf/test-timing.json
      - name: Upload merged baseline artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-baseline-merged
          path: |
            perf-baseline.json
            .planning/perf/test-timing.json
          retention-days: 30
