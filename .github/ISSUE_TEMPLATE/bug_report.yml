---
name: Bug Report
description: Report something that is not working correctly
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: GSD Version
      description: "Run: npm list -g @chude/get-stuff-done"
      placeholder: "e.g., 1.18.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Claude Code
        - Gemini CLI
        - OpenCode
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed failure and its impact.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable corrected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run /gsd:...
        2. ...
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope boundaries
      description: State affected and explicitly unaffected surfaces.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List independently verifiable completion criteria.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification required
      description: Name the local and hosted evidence required to close this bug.
    validations:
      required: true
  - type: textarea
    id: non_claims
    attributes:
      label: Explicit non-claims
      description: State what this fix will not prove or complete.
    validations:
      required: true
  - type: input
    id: gsd
    attributes:
      label: Linked GSD artifact
      description: Link the owning phase, plan, backlog, or inbox record.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste any error output (will be formatted as code)
      render: shell
    validations:
      required: false
