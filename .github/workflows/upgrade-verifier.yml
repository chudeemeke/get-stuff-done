name: Upgrade Verifier

on:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".planning/upstream-authority.json"
      - "package.json"
      - "bun.lock"
      - "scripts/compose.js"
      - "scripts/verify-upgrade.js"
      - "bin/install.js"
      - "overlay/**"
      - "overrides/**"
      - ".github/workflows/upgrade-verifier.yml"

permissions:
  contents: read

jobs:
  upgrade-verifier:
    name: Upgrade Verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      verdaccio:
        image: verdaccio/verdaccio@sha256:bcd0dc5f10d0b9cca5a21b1f4fb3b08c6d90978bc87b8b46402abb271e0d573a
        ports:
          - 4873:4873
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install repository dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Wait for Verdaccio
        run: |
          for attempt in {1..30}; do
            if npm ping --registry http://localhost:4873/; then
              exit 0
            fi
            echo "Verdaccio not ready yet (${attempt}/30)"
            sleep 2
          done
          exit 1
      - name: Run upgrade verifier
        run: >-
          bun run verify-upgrade --from 1.5.0 --to 1.6.1 --registry-url http://localhost:4873/ --json --report upgrade-report.json
      - name: Upload upgrade report
        if: ${{ always() && hashFiles('upgrade-report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-report
          path: upgrade-report.json
          retention-days: 30
